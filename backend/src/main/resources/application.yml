spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/drexcel
    username: drexcel
    password: drexcel
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTSigningThatMustBeAtLeast256BitsLongForHS256Algorithm
    expiration-ms: 86400000

server:
  port: 8080
